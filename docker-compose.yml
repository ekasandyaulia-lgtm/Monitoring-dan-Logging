services:
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.gmail.com:587
      - GF_SMTP_USER=EMAIL_KAMU@gmail.com
      - GF_SMTP_PASSWORD=APP_PASSWORD_GMAIL
      - GF_SMTP_FROM_ADDRESS=EMAIL_KAMU@gmail.com
      - GF_SMTP_FROM_NAME=Grafana Alert
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  grafana_data: